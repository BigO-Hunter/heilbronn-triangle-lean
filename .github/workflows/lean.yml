name: Lean proof

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  submission:
    name: Build the exact-K Heilbronn proof
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - name: Check out the proof
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Lean and cached Mathlib dependencies, build the proof
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          lake-package-directory: .
          build: "true"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
      - name: Audit transitive axioms (AxCheck.lean)
        run: |
          lake env lean AxCheck.lean | tee /tmp/axcheck.txt
          if grep -q sorryAx /tmp/axcheck.txt; then
            echo "sorryAx present in axiom audit" >&2
            exit 1
          fi
